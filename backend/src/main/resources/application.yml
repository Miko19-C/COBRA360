server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
spring:
  application:
    name: cobra360
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/cobra360?serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:cobra360}
    password: ${DB_PASSWORD:cobra360_local}
    hikari:
      connection-init-sql: "SET time_zone = '-05:00'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
  jackson:
    time-zone: America/Lima
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    pe.edu.utp.cobra360: INFO
